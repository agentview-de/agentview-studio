# CI gates for agentView Studio.
#
# The shipped app is dependency-free vanilla JS with native ES modules and no
# build step — that philosophy is for the RUNTIME. The dev toolchain (ESLint,
# Playwright) lives in devDependencies and never reaches shipped code.
#
#   headless — pure-function suites under Node, no install (fast first signal).
#   lint     — ESLint flat config (dead imports, unused vars, == traps), plus
#              the consistency gates: i18n coverage, template-store invariants
#              and the doc counts that would otherwise silently go stale.
#   browser  — the DOM-dependent suites (sanitize, schema, slide round-trip,
#              canvas z-order) in headless Chromium. The sanitizer + schema are
#              security/data-loss critical and MUST be gated, not run by hand.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run headless (DOM-free) test suite
        run: node test/run-node.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dev tooling
        run: npm ci
      - name: Lint
        run: npm run lint
      # The consistency gates. They are cheap and need no browser, so they ride
      # with lint rather than earning a job of their own — but they DO have to
      # run somewhere: a guard that only fires on a developer's machine is a
      # guard for whoever remembers to type `npm run check`.
      #   i18n  — every t() key exists in both dictionaries
      #   store — the template store's own invariants
      #   docs  — the counts the README and the welcome screen quote, against
      #           the registry that actually holds them
      - name: Consistency gates (i18n · template store · docs)
        run: npm run i18n -- --quiet && npm run store && npm run docs -- --quiet

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dev tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser test suite (sanitize, schema, round-trip, canvas)
        run: node test/run-browser.mjs
