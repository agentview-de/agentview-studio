<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agentView Studio · Tests</title>
  <style>
    :root { color-scheme: dark; }
    body { background: #0e0f12; color: #d9dde6; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 16px 0; font-weight: 600; }
    h2 { font-size: 14px; margin: 16px 0 6px 0; font-weight: 600; color: #9aa5b6; text-transform: uppercase; letter-spacing: .08em; }
    .tr-summary { padding: 10px 14px; border-radius: 8px; font-weight: 600; margin-bottom: 12px; }
    .tr-summary-pass { background: #14361f; color: #6bd998; border: 1px solid #1f5933; }
    .tr-summary-fail { background: #3b1418; color: #ef6d72; border: 1px solid #5d2129; }
    .tr-suite { background: #161922; border: 1px solid #1f2433; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
    .tr-suite ul { list-style: none; padding: 0; margin: 4px 0 0 0; }
    .tr-suite li { padding: 3px 0; border-top: 1px solid #1f2433; }
    .tr-suite li:first-child { border-top: none; }
    .tr-pass { color: #8ab59c; }
    .tr-fail { color: #ef6d72; }
    .tr-mark { display: inline-block; width: 18px; text-align: center; font-weight: 700; }
    pre { background: #0b0d12; color: #ef9a9d; padding: 10px 12px; border-radius: 6px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; margin: 6px 0 0 0; }
    #boot-error { color: #ef6d72; background: #2a0f12; padding: 10px 14px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>agentView Studio — test suite</h1>
  <div id="test-results">Loading…</div>
  <div id="boot-error" hidden></div>

  <script type="module">
    // Load every *.test.js, then run. Each test file registers via the
    // top-level describe()/test() calls in runner.js.
    import { runAll } from './runner.js';

    const suites = [
      './escape.test.js',
      './safe-url.test.js',
      './sanitize.test.js',
      // Browser-only: the thumbnail renderer's box arithmetic needs a laid-out
      // element. No app stylesheet needed — every number it asserts is inline.
      './slide-thumb.test.js',
      // Browser-only: fetches slide-themes.css as text to check it against the
      // theme registry. Two files, one question.
      './themes.test.js',
      './schema.test.js',
      './round-trip.test.js',
      './migrate.test.js',
      './animations.test.js',
      './module-graph.test.js',
      './live-source.test.js',
      './field-control-registry.test.js',
      './widget-host.test.js',
      './admin-tab-shell.test.js',
      './canvas-geo.test.js',
      './shapes.test.js',
      './arrange.test.js',
      './layers.test.js',
      './master.test.js',
      './scheduler.test.js',
      './variant-resolver.test.js',
      './binding-resolver.test.js',
      './ics-parse.test.js',
      './store-template-preview.test.js',
      './publish.test.js',
      './store.test.js',
      // Undo/redo: the pure stack, plus the two store cases that were timing bugs
      // (ctrl+Z inside the commit debounce; the missing baseline on load).
      './undo-stack.test.js',
      // Re-entrancy guards for async refreshes — coalescing bursts (fleet refresh)
      // and dropping stale answers (asset search).
      './async-refresh.test.js',
      // Reconnect schedule for the event stream (exponential, capped, jittered).
      './reconnect-backoff.test.js',
      // The two strings the player puts on a screen itself (banner), localised by
      // the display's own language setting.
      './player-messages.test.js',
      // Browser only (opens a real overlay): the gesture that lets somebody
      // standing at a display open the player's diagnostics without a URL bar.
      './player-hud.test.js',
      // Browser only (mounts the real rail): what it shows, and — by element
      // identity — that it redraws only the card that changed.
      './slide-rail.test.js',
      // Canvas colours: a gradient stop throws where fillStyle silently ignores.
      './css-color.test.js',
      // Which field is "the id of a display group" — the endpoints take categoryId.
      './category-id.test.js',
      // Browser only (displays.js pulls in DOM modules at import): which
      // displays land in which group.
      './fleet-membership.test.js',
      // Browser only (opens the real drawer): the tab strip as a screen reader
      // and a keyboard meet it.
      './display-drawer.test.js',
      // Browser only (renders the real editor): the day-parting weekday chips
      // follow the Studio's language, not the browser's.
      './schedule-editor.test.js',
      './brand-kit-apply.test.js',
      './asset-upload.test.js',
      './weather-format.test.js',
      './canvas-math.test.js',
      './smart-snap.test.js',
      './rich-text-table.test.js',
      './api-url.test.js',
      // Display capability three-state reader (reported yes / reported no / never reported).
      './display-capabilities.test.js',
      // Design catalog + the icon derived from each design rects.
      './designs.test.js',
      './templates.test.js',
      './new-widgets.test.js',
      // Player front door: only a real playlist may be applied or cached.
      './playlist-response.test.js',
      // Day-parting re-check: cursor bookkeeping when the visible set changes.
      './schedule-reconcile.test.js',
      // URL-probe verdict: the status is judged for every kind, JSON included.
      './probe-verdict.test.js',
      './importers.test.js',
      './custom-template.test.js',
      './custom-widgets.test.js',
      './tier-filter.test.js',
      './looks.test.js',
      './sync-clock.test.js',
      './calendar-views.test.js',
      './smart-split.test.js',
      './format-date.test.js',
      './format-bytes.test.js',
      './web-embed.test.js',
      './refresh-field.test.js',
      './api-paging.test.js',
      './publish-assets.test.js',
      './file-io.test.js',
      './playlist-import.test.js',
      './shortcuts.test.js',
      './preview-flow.test.js',
      './drag-drop.test.js',
      './command-palette.test.js',
      './context-menu.test.js',
      './inert-background.test.js',
      './toast.test.js',
      './poll-schedule.test.js',
      './plugin-network.test.js',
      './privacy-gate.test.js',
      './publish-inflight.test.js',
      './format-number.test.js',
      './chart-locale.test.js',
      './field-effect.test.js',
      './empty-state.test.js',
      './current-slide.test.js',
      './slide-retention.test.js',
      './persist-failure.test.js',
      './topbar-narrow.test.js',
      './debug-hud.test.js',
      './tablist.test.js',
      './slide-duplicate.test.js',
    ];

    (async () => {
      try {
        for (const s of suites) await import(s);
        const summary = await runAll('#test-results');
        // Surface a quick page title so a watch tab shows the result at a glance.
        document.title = (summary.fail === 0 ? '✓ ' : '✗ ') + document.title;
      } catch (e) {
        const host = document.getElementById('boot-error');
        host.hidden = false;
        host.innerHTML = `<strong>Test bootstrap failed:</strong><pre>${(e.stack || e.message || String(e)).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</pre>`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
